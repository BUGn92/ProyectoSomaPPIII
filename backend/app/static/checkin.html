<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOMA Gym - Check-in Digital</title>
    <!-- Google Fonts (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hoja de Estilos General -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos específicos para la terminal táctil de Check-in */
        .checkin-body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #152238 0%, #090d16 80%);
            overflow-y: auto;
            position: relative;
        }

        .checkin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(21, 30, 46, 0.7);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-light);
        }

        .checkin-brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .checkin-brand i {
            font-size: 2rem;
            color: var(--primary);
        }

        .checkin-brand h2 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .checkin-brand h2 span {
            color: var(--primary);
        }

        .live-clock-card {
            text-align: right;
        }

        .live-time {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .live-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        .checkin-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .kiosk-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 520px;
            padding: 2.25rem 2rem;
            text-align: center;
            position: relative;
        }

        .kiosk-title {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--text-primary);
        }

        .kiosk-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        .dni-display-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .dni-input {
            width: 100%;
            background: var(--bg-input);
            border: 2px solid var(--border-light);
            border-radius: 14px;
            padding: 1.1rem 1.25rem;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-primary);
            text-align: center;
            outline: none;
            transition: var(--transition-smooth);
        }

        .dni-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
        }

        /* Teclado numérico táctil optimizado para tablet */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .keypad-btn {
            background: rgba(39, 53, 73, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-size: 1.6rem;
            font-weight: 600;
            padding: 1rem 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
        }

        .keypad-btn:active, .keypad-btn.active {
            background: var(--primary);
            color: #fff;
            transform: scale(0.96);
        }

        .keypad-btn.action-clear {
            color: var(--danger);
            font-size: 1.2rem;
        }

        .keypad-btn.action-back {
            color: var(--warning);
            font-size: 1.3rem;
        }

        .btn-checkin-submit {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
            border: none;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
            transition: var(--transition-smooth);
        }

        .btn-checkin-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.6);
        }

        .btn-checkin-submit:active {
            transform: scale(0.98);
        }

        /* Modal Overlay de Resultado de Check-in */
        .checkin-result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .checkin-result-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .result-card {
            background: var(--bg-card);
            border: 2px solid var(--border-light);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            transform: translateY(30px) scale(0.95);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .checkin-result-overlay.active .result-card {
            transform: translateY(0) scale(1);
        }

        .result-card.status-success {
            border-color: var(--success);
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.35);
        }

        .result-card.status-warning {
            border-color: var(--warning);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.35);
        }

        .result-card.status-danger {
            border-color: var(--danger);
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.35);
        }

        .result-avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.25rem;
        }

        .result-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--border-light);
            background: var(--bg-input);
        }

        .result-icon-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: white;
            border: 3px solid var(--bg-card);
        }

        .result-name {
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }

        .result-dni {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }

        .result-badges-row {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .kiosk-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1rem;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .kiosk-badge.badge-ok {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .kiosk-badge.badge-alert {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .kiosk-badge.badge-warn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .result-message-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.75rem;
            font-size: 1.05rem;
            line-height: 1.45;
            color: var(--text-primary);
        }

        .result-footer-countdown {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .btn-result-close {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 0.55rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .btn-result-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .kiosk-back-link {
            position: absolute;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .kiosk-back-link:hover {
            opacity: 1;
            color: var(--primary);
        }
    </style>
</head>
<body class="checkin-body">

    <!-- Header Superior -->
    <header class="checkin-header">
        <div class="checkin-brand">
            <i class="fa-solid fa-dumbbell"></i>
            <h2>SOMA<span>GYM</span></h2>
        </div>
        <div class="live-clock-card">
            <div class="live-time" id="live-clock">--:--:--</div>
            <div class="live-date" id="live-date">Cargando fecha...</div>
        </div>
    </header>

    <!-- Contenido Principal: Teclado y Entrada -->
    <main class="checkin-container">
        <div class="kiosk-card">
            <h1 class="kiosk-title">Check-in Digital</h1>
            <p class="kiosk-subtitle">Ingresa tu DNI para registrar tu ingreso a la sala de entrenamiento</p>

            <form id="checkin-form">
                <div class="dni-display-wrapper">
                    <input type="text" id="kiosk-dni-input" class="dni-input" placeholder="DNI" maxlength="8" pattern="[0-9]{7,8}" inputmode="numeric" autofocus required autocomplete="off">
                </div>

                <!-- Teclado Numérico Táctil -->
                <div class="keypad-grid">
                    <button type="button" class="keypad-btn" data-key="1">1</button>
                    <button type="button" class="keypad-btn" data-key="2">2</button>
                    <button type="button" class="keypad-btn" data-key="3">3</button>
                    <button type="button" class="keypad-btn" data-key="4">4</button>
                    <button type="button" class="keypad-btn" data-key="5">5</button>
                    <button type="button" class="keypad-btn" data-key="6">6</button>
                    <button type="button" class="keypad-btn" data-key="7">7</button>
                    <button type="button" class="keypad-btn" data-key="8">8</button>
                    <button type="button" class="keypad-btn" data-key="9">9</button>
                    <button type="button" class="keypad-btn action-clear" data-key="clear" title="Borrar todo">C</button>
                    <button type="button" class="keypad-btn" data-key="0">0</button>
                    <button type="button" class="keypad-btn action-back" data-key="backspace" title="Borrar último dígito">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </div>

                <button type="submit" id="btn-submit-checkin" class="btn-checkin-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Registrar Ingreso</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Enlace de regreso al sistema -->
    <a href="index.html" class="kiosk-back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Volver al Inicio / Acceso Personal</span>
    </a>

    <!-- Overlay Modal de Resultado de Check-in -->
    <div id="checkin-result-overlay" class="checkin-result-overlay">
        <div id="result-card" class="result-card status-success">
            <div class="result-avatar-wrapper">
                <img id="result-avatar" class="result-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Foto del socio">
                <div id="result-icon-badge" class="result-icon-badge" style="background: var(--success);">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>

            <h2 id="result-name" class="result-name">Nombre del Socio</h2>
            <p id="result-dni" class="result-dni">DNI: --------</p>

            <div class="result-badges-row">
                <div id="badge-cuota" class="kiosk-badge badge-ok">
                    <i class="fa-solid fa-circle-check"></i>
                    <span id="badge-cuota-text">Cuota: Al día</span>
                </div>
                <div id="badge-apto" class="kiosk-badge badge-ok">
                    <i class="fa-solid fa-heart-pulse"></i>
                    <span id="badge-apto-text">Apto Médico: Vigente</span>
                </div>
            </div>

            <div id="result-message-box" class="result-message-box">
                ¡Bienvenido a SOMA!
            </div>

            <div class="result-footer-countdown">
                <span id="countdown-text">Cerrando en 5 segundos...</span>
                <button type="button" id="btn-close-result" class="btn-result-close">
                    Siguiente Socio <i class="fa-solid fa-forward-step" style="margin-left: 0.35rem;"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Inicialización ES6 -->
    <script type="module" src="js/modules/checkin.module.js"></script>
</body>
</html>
